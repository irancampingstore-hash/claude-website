# /etc/nginx/sites-available/mcp  — run `certbot --nginx -d mcp.iranoutdoor.com` afterwards
server {
    listen 80;
    server_name mcp.iranoutdoor.com;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (PC agent link at /agent/ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # MCP responses must not be buffered; tool calls (publishing, local AI) can be slow
        proxy_buffering off;
        proxy_read_timeout 330s;
        client_max_body_size 5m;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
